<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Which F'n App — 76ers</title>
  <link rel="icon" href="./logos/1610612755.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <img class="brand-logo" src="./logos/1610612755.svg" alt="" width="48" height="48">
        <div>
          <h1>Which F'n App</h1>
          <p id="season" class="sub"></p>
        </div>
      </div>
      <div class="controls">
        <fieldset class="market">
          <legend>Watching from</legend>
          <div class="segments">
            <label><input type="radio" name="market" value="out"> Outside Philly</label>
            <label><input type="radio" name="market" value="in"> Philly market</label>
          </div>
        </fieldset>
        <label class="switch">
          <input type="checkbox" id="show-past" role="switch">
          <span class="track" aria-hidden="true"></span>
          Show past games <span id="past-count"></span>
        </label>
        <div class="switch-group">
          <label class="switch">
            <input type="checkbox" id="only-mine" role="switch">
            <span class="track" aria-hidden="true"></span>
            Only my services
          </label>
          <span id="only-mine-hint" class="hint" role="tooltip">Pick services first</span>
        </div>
      </div>
      <details class="services">
        <summary>My services <span id="services-count"></span></summary>
        <div id="service-list" class="service-list" role="group" aria-label="My services"></div>
      </details>
      <p id="status" class="sub"></p>
    </div>
  </header>
  <main class="wrap">
    <ol id="games"></ol>
    <p class="footnote">US viewing rules. League Pass is subject to local blackouts, including the opponent's home market.</p>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
